<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whatss Add</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 20px 20px 0 20px;
    }

    .lang {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .lang option {
      color: black;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 35px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .tile {
      font-size: 38px;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 17px;
      color: #d8e6ec;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .form {
      width: 100%;
      padding: 15px 16px;
      margin-bottom: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      outline: none;
      background: rgba(255, 255, 255, 0.92);
      color: #1b1b1b;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    .form:focus {
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.25);
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-paste {
      background: #ffffff;
      color: #1d1d1d;
      margin-bottom: 10px;
    }

    .button-paste:hover {
      background: #f1f1f1;
    }

    .button-main {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: white;
    }

    .button-main:hover {
      filter: brightness(1.05);
    }

    .button-back {
      background: rgba(255, 255, 255, 0.14);
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .button-back:hover {
      background: rgba(255, 255, 255, 0.20);
    }

    .result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .info {
      font-size: 24px;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .link_result {
      display: inline-block;
      margin-top: 8px;
      color: #7dffb0;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
      word-break: break-all;
      transition: 0.2s ease;
    }

    .link_result:hover {
      color: #b6ffd0;
      text-decoration: underline;
    }

    .rodape {
      text-align: center;
      padding: 20px 20px 30px;
    }

    .rodape_link {
      text-decoration: none;
      font-size: 16px;
      color: #ffffff;
      font-weight: 600;
    }

    .rodape_link:hover {
      text-decoration: underline;
    }

    .direitos {
      margin-top: 14px;
      font-size: 13px;
      color: #d5dfe4;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .tile {
        font-size: 30px;
      }

      .info {
        font-size: 21px;
      }

      .link_result {
        font-size: 22px;
      }

      .card {
        padding: 28px 18px;
      }
    }
  </style>
</head>

  <script>
    function changeLanguage() {
      const language = document.getElementById("languageSelect").value;

      if (!language) return;

      const translations = {
        "pt": {
          "title": "Adicionar WhatsApp",
          "enterNumber": "Digite seu número de WhatsApp:",
          "denv": "Desenvolvido por MHPS",
          "gen": "Clique aqui",
          "pasteBtn": "Colar número",
          "country": "Selecione o país",
          "direito": "© 2023 WhatsApp Inc. Todos os direitos reservados. O WhatsApp e seus logotipos são marcas comerciais da WhatsApp Inc. Este site utiliza o WhatsApp como ferramenta de comunicação e segue os termos de serviço da plataforma.",
          "clickNumber": "Clique no número abaixo para acessar:",
          "invalidNumber": "Digite um número válido.",
          "clipboardError": "Não foi possível acessar a área de transferência.",
          "back": "Voltar"
        },
        "en": {
          "title": "WhatsApp Add",
          "enterNumber": "Enter your WhatsApp number:",
          "denv": "Developed by MHPS",
          "gen": "Click here",
          "pasteBtn": "Paste number",
          "country": "Select Country",
          "direito": "© 2023 WhatsApp Inc. All rights reserved. WhatsApp and its logos are trademarks of WhatsApp Inc. This website uses WhatsApp as a communication tool and adheres to the platform's terms of service.",
          "clickNumber": "Click on the number below to access:",
          "invalidNumber": "Please enter a valid number.",
          "clipboardError": "Could not access the clipboard.",
          "back": "Back"
        }
      };

      document.getElementById("title").innerText = translations[language].title;
      document.getElementById("enterNumber").innerText = translations[language].enterNumber;
      document.getElementById("denv").innerHTML = translations[language].denv;
      document.getElementById("gen").innerHTML = translations[language].gen;
      document.getElementById("pasteBtn").innerHTML = translations[language].pasteBtn;
      document.getElementById("country").innerHTML = translations[language].country;
      document.getElementById("direito").innerHTML = translations[language].direito;

      const clickNumber = document.getElementById("clickNumber");
      if (clickNumber) {
        clickNumber.innerHTML = translations[language].clickNumber;
      }

      const buttonBack = document.getElementById("buttonBack");
      if (buttonBack) {
        buttonBack.value = translations[language].back;
      }
    }

    function getLanguage() {
      const language = document.getElementById("languageSelect").value;
      return language === "pt" ? "pt" : "en";
    }

    function limparNumero(campo) {
      campo.value = campo.value.replace(/\D/g, "");
    }

    async function colarNumero() {
      const language = getLanguage();
      const messages = {
        pt: "Não foi possível acessar a área de transferência.",
        en: "Could not access the clipboard."
      };

      try {
        const texto = await navigator.clipboard.readText();
        const somenteNumeros = texto.replace(/\D/g, "");
        document.getElementById("num").value = somenteNumeros;
      } catch (erro) {
        alert(messages[language]);
      }
    }

    function adicionarTexto() {
      const countryCode = document.getElementById("countryCode").value;
      const inputNum = document.getElementById("num");
      const num = inputNum.value.replace(/\D/g, "");
      const language = getLanguage();
      const textTrad = document.getElementById("respo");

      inputNum.value = num;

      if (num.length > 0) {
        let resultHtml;

        if (language === "pt") {
          resultHtml = `
            <h1 class="tile" id="title">Adicionar WhatsApp</h1>
            <div class="result-box">
              <h2 class="info" id="clickNumber">Clique no número abaixo para acessar:</h2>
              <a class="link_result" title="Clique aqui para acessar" href="https://wa.me/${countryCode}${num}" target="_blank">${countryCode}${num}</a>
            </div>
            <input class="button button-back" id="buttonBack" type="button" value="Voltar" title="Clique aqui para voltar" onClick="history.go(0)">
          `;
        } else {
          resultHtml = `
            <h1 class="tile" id="title">WhatsApp Add</h1>
            <div class="result-box">
              <h2 class="info" id="clickNumber">Click on the number below to access:</h2>
              <a class="link_result" title="Click here to access" href="https://wa.me/${countryCode}${num}" target="_blank">${countryCode}${num}</a>
            </div>
            <input class="button button-back" id="buttonBack" type="button" value="Back" title="Click here to back" onClick="history.go(0)">
          `;
        }

        textTrad.innerHTML = resultHtml;
      } else {
        alert(language === "pt" ? "Digite um número válido." : "Please enter a valid number.");
      }
    }
  </script>
